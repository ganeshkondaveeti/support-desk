# Lint, type-check, and test. No secrets; cues_only LLM backend.
name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  LLM_PROVIDER: cues_only
  MCP_BACKEND: local

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: mcp-server/.nvmrc
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install and build MCP server
        working-directory: mcp-server
        run: npm ci && npm test && npm run build

      - name: Install Python deps
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check app tests
          uv run ruff format --check app tests

      - name: Type check (strict on guardrails/gate when implemented)
        run: |
          if find app/guardrails -name '*.py' ! -name '__init__.py' | grep -q .; then
            uv run mypy --strict app/guardrails
          fi
          if find app/gate -name '*.py' ! -name '__init__.py' | grep -q .; then
            uv run mypy --strict app/gate
          fi

      - name: Test
        run: uv run pytest -q

      - name: Gate boundary grep (P4.7)
        run: |
          # Only executor may import mcp_client or construct OutboxReply.
          set +e
          hits=$(grep -RInE 'from app\.gate\.mcp_client import|import app\.gate\.mcp_client' app \
            | grep -v 'app/gate/executor.py' | grep -v 'app/gate/mcp_client.py' || true)
          outbox=$(grep -RInE 'OutboxReply[[:space:]]*\(' app \
            | grep -v 'app/gate/executor.py' | grep -v 'app/db/models.py' || true)
          set -e
          if [ -n "$hits" ] || [ -n "$outbox" ]; then
            echo "$hits"
            echo "$outbox"
            exit 1
          fi

      - name: Health smoke
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          pid=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'; then
              kill $pid
              exit 0
            fi
            sleep 1
          done
          kill $pid || true
          exit 1

      - name: Evals (CuesOnly)
        # P10: three gating suites over HTTP; quality suite is informational.
        timeout-minutes: 45
        run: |
          uv run python -m evals.run_all --backend cues --seed 42
        env:
          APP_ENV: test
          LLM_PROVIDER: cues_only
          MCP_BACKEND: local
          ADMIN_TOKEN: ci-eval-token

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: evals/results/
          retention-days: 14

  ui:
    # Plan P9: lint, types, unit tests, build + content check, then e2e (Playwright + axe)
    # against the real API with the cues_only backend.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: |
          npm ci
          uv sync --frozen

      - name: Lint and type check
        run: |
          npm run lint
          npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (includes the Stitch content check)
        run: npm run build

      - name: End-to-end (Playwright + axe)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 7

  docker:
    # Plan P11.1 / P11.6: build the production image, run it, smoke-test it, and check
    # that state survives a restart on the volume without re-seeding.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t support-desk:ci .

      - name: Run container
        run: |
          docker run -d --name sd -p 8000:8000 \
            -e ADMIN_TOKEN=ci-smoke-token -e LLM_PROVIDER=cues_only \
            -v sd-state:/data/state support-desk:ci

      - name: Smoke test
        env:
          ADMIN_TOKEN: ci-smoke-token
        run: python3 scripts/smoke.py http://127.0.0.1:8000

      - name: State survives a restart
        run: |
          count() { curl -fsS "http://127.0.0.1:8000/api/tickets?limit=1" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"])'; }
          before=$(count)
          docker restart sd
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/api/health >/dev/null && break; sleep 2; done
          after=$(count)
          echo "tickets before=$before after=$after"
          test "$before" = "$after"
          curl -fsS http://127.0.0.1:8000/api/health | python3 -c \
            'import json,sys; d=json.load(sys.stdin); assert d["gate_mode"]=="full", d; print(d)'

      - name: Container logs
        if: always()
        run: docker logs sd 2>&1 | tail -150
