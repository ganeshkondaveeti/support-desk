# Backup weekly trigger for hosts that sleep (architecture §11 / P8.7).
# Idempotent with the in-process APScheduler via the weekly run lock + input_hash.
name: Weekly loop backup

on:
  schedule:
    # Monday 09:00 Asia/Kolkata = Monday 03:30 UTC
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/weekly/run
        env:
          SUPPORT_DESK_URL: ${{ secrets.SUPPORT_DESK_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPPORT_DESK_URL:-}" ]; then
            echo "SUPPORT_DESK_URL secret not set; skipping (set after P11 host)."
            exit 0
          fi
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "ADMIN_TOKEN secret not set" >&2
            exit 1
          fi
          base="${SUPPORT_DESK_URL%/}"
          code=$(curl -sS -o /tmp/weekly_run.json -w "%{http_code}" \
            -X POST "${base}/api/weekly/run" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP ${code}"
          cat /tmp/weekly_run.json || true
          # 200 = ran / noop; 409 = already running (acceptable overlap).
          if [ "$code" = "200" ] || [ "$code" = "409" ]; then
            exit 0
          fi
          exit 1
