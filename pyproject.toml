[project]
name = "support-desk"
version = "0.0.1"
description = "The Support Desk — Groww weekly pulse + multi-agent reply drafts."
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10",
  "fastapi>=0.115",
  "google-genai>=1.0",
  "groq>=0.13",
  "httpx>=0.28",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "mcp>=1.0",
  "pydantic-settings>=2.0",
  "simhash>=2.1",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
  "ignore:Core Pydantic V1 functionality isn't compatible:UserWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "."
packages = ["app"]

[[tool.mypy.overrides]]
module = [
  "apscheduler.*",
  "simhash.*",
  "langgraph.*",
  "langgraph_checkpoint_sqlite.*",
  "groq.*",
  "google.genai.*",
  "mcp.*",
]
ignore_missing_imports = true
